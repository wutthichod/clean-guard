# M2 - Model config
# Code asks for a profile, never a model tag. Change models here.
# Pick profiles from your Session 1 benchmark results.

runtime:
  base_url: http://localhost:11434
  api: native            # native = Ollama /api/chat ; openai = /v1/chat/completions
  timeout_s: 300

profiles:
  fast:
    model: qwen3:8b-q4_K_M
    temperature: 0
    num_ctx: 8192
    num_predict: 1024    # was 512: CleanGuard batches of 8 verdicts need ~360 tokens + headroom
    keep_alive: 10m
    think: false         # qwen3 reasoning off: faster, cleaner JSON

  # Tuned for a MacBook Air M3 with 8 GB (GPU limit ~5.3 GB). qwen3:8b-q4_K_M spills 31% to
  # CPU there and took >8 min for one 8-file batch, so "reasoning" is the same 4B model with
  # thinking on (~57 s per batch, 100% GPU). The same model tag and num_ctx as "fast" means
  # Ollama keeps one model loaded and never swaps. On a 16 GB+ machine, use qwen3:8b-q4_K_M,
  # num_ctx 16384, num_predict 1024, think: false (the original setting).
  # Now: both profiles use qwen3:8b-q4_K_M (16 GB Mac, the full UAT passed on it). On an 8 GB
  # machine, set both back to qwen3:4b-q4_K_M. Keep num_ctx equal in both, or Ollama reloads.
  # Thinking is off in both (faster). The full UAT run on the 8B had it on in "reasoning"; to
  # turn it back on, set think: true and num_predict: 4096 below.
  reasoning:
    model: qwen3:8b-q4_K_M
    temperature: 0
    num_ctx: 8192        # must equal fast's num_ctx, or Ollama reloads the model
    num_predict: 1024    # JSON only; thinking would need ~4096
    keep_alive: 10m
    think: false

  # fallback (gemma3:12b) is kept but never used by CleanGuard (offloads on an 8 GB GPU)
  fallback:
    model: gemma3:12b-it-q4_K_M   # offloads on 8 GB: slow, used rarely
    temperature: 0
    num_ctx: 8192
    num_predict: 512
    keep_alive: 5m
    # no "think" key: gemma3 has no reasoning mode

logging:
  file: logs/calls.jsonl
